[package]
name = "pbf_history_reader"
version = "1.3.2"
edition = "2021"
rust-version = "1.93.1"

[dependencies]
osmpbf = "0.3.0"
strum = "0.24"
strum_macros = "0.24"
chrono = "0.4.24"
postgres = {version = "0.19.5", features = ["array-impls", "with-chrono-0_4"]}
postgres_rustls = {version = "0.1.5", features = ["runtime"]}
rustls = "0.23"
webpki-roots = "0.26"
tokio-rustls = "0.26"
itertools = "0.10.5"