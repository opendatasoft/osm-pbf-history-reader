name: Rust compile & release

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-x86_64:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        target: x86_64-unknown-linux-musl

    - name: Build x86_64
      run: cargo build --target x86_64-unknown-linux-musl --release --verbose

    - name: Upload x86_64 artifact
      uses: actions/upload-artifact@v3
      with:
        name: x86_64-artifacts
        path: target/x86_64-unknown-linux-musl/release/*

  build-arm64:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        target: aarch64-unknown-linux-musl

    - name: Install cross
      run: cargo install cross

    - name: Build arm64
      run: cross build --target aarch64-unknown-linux-musl --release --verbose

    - name: Upload arm64 artifact
      uses: actions/upload-artifact@v3
      with:
        name: arm64-artifacts
        path: target/aarch64-unknown-linux-musl/release/*

  release:
    needs: [build-x86_64, build-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download x86_64 artifacts
      uses: actions/download-artifact@v3
      with:
        name: x86_64-artifacts
        path: release-x86_64

    - name: Download arm64 artifacts
      uses: actions/download-artifact@v3
      with:
        name: arm64-artifacts
        path: release-arm64

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release-x86_64/*
          release-arm64/*
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
