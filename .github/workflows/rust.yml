name: Rust compile & release

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-x86_64:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.93.1
        target: x86_64-unknown-linux-musl

    - name: Install musl tools
      run: sudo apt-get install -y musl-tools

    - name: Build x86_64
      run: cargo build --target x86_64-unknown-linux-musl --release --verbose

    - name: Upload x86_64 artifact
      uses: actions/upload-artifact@v7
      with:
        name: x86_64-artifacts
        path: target/x86_64-unknown-linux-musl/release/*

  build-arm64:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        target: aarch64-unknown-linux-musl

    - name: Install cross
      run: cargo install cross

    - name: Build arm64
      run: cross build --target aarch64-unknown-linux-musl --release --verbose

    - name: Upload arm64 artifact
      uses: actions/upload-artifact@v7
      with:
        name: arm64-artifacts
        path: target/aarch64-unknown-linux-musl/release/*


  build-macos-arm64:
      runs-on: macos-latest

      steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: aarch64-apple-darwin

      - name: Build macOS arm64
        run: cargo build --target aarch64-apple-darwin --release --verbose

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-artifacts
          path: target/aarch64-apple-darwin/release/*


  release:
    needs: [build-x86_64, build-arm64, build-macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download x86_64 artifacts
      uses: actions/download-artifact@v7
      with:
        name: x86_64-artifacts
        path: release-x86_64

    - name: Download arm64 artifacts
      uses: actions/download-artifact@v7
      with:
        name: arm64-artifacts
        path: release-arm64

    - name: Download macos-arm64 artifacts
      uses: actions/download-artifact@v7
      with:
        name: macos-arm64-artifacts
        path: release-macos-arm64

    - name: Prepare release artifacts
      run: |
        cp release-x86_64/pbf_history_reader pbf_history_reader-x86_64
        cp release-arm64/pbf_history_reader pbf_history_reader-arm64
        cp release-macos-arm64/pbf_history_reader pbf_history_reader-macos-arm64
        chmod 755 pbf_history_reader-*

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          pbf_history_reader-x86_64
          pbf_history_reader-arm64
          pbf_history_reader-macos-arm64
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
